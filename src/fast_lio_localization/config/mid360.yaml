/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.2
        filter_size_map: 0.2
        map_voxel_size: 0.1
        scan_voxel_size: 0.1
        freq_localization: 0.5
        localization_th: 0.80
        fov_far: 25.0
        max_correction_xyz: 0.5   # m
        max_correction_deg: 5.0   # deg
        # 0.5m 제한은 그대로 유지한다. 단, 같은 고품질 보정(최대 1.5m)이
        # 2초 간격으로 3번 연속 확인될 때만 stale map->odom 을 복구한다.
        confirmed_recovery_enabled: true
        confirmed_recovery_count: 3
        confirmed_recovery_max_xyz: 1.5
        confirmed_recovery_max_deg: 5.0
        confirmed_recovery_min_tight_fitness: 0.90
        confirmed_recovery_max_fitness_drop: 0.01
        confirmed_recovery_xyz_tolerance: 0.15
        confirmed_recovery_deg_tolerance: 3.0
        continuous_global_localization: true
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        # FAST-LIO 입력은 약 10Hz다. transform_fusion이 동일 자세를 50Hz로
        # 재계산하면 Jetson CPU를 과점유해 3-LiDAR merge가 3~5Hz로 밀린다.
        publish_rate_hz: 10.0
        # Nav2 transform_tolerance(0.1s) 안에 항상 최신 TF가 있도록 20Hz로
        # 재발행한다. 50Hz는 의미 없이 Python/TF 부하만 늘린다.
        keepalive_rate_hz: 20.0
        common:
            lid_topic:  "/livox_merge/merged_pointcloud"   # 라이다 3대 병합 (base_link 기준)
            imu_topic:  "/livox/imu_192_168_1_135"   # 상단(livox_top) MID-360 내장 IMU
            time_sync_en: false        # 라이다와 IMU가 같은 장비(MID-360) 클럭이므로 불필요
                                        # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 5                # 5 = LIVOX_PC2. livox_ros_driver2 xfer_format=0 의
                                         # PointCloud2 레이아웃 (x y z intensity tag line timestamp).
                                         # timestamp 가 절대시각이라 3대를 합쳐도 점 시간이
                                         # 한 축 위에 놓인다. preprocess.cpp 의 livox_pc2_handler.
            scan_line:  4                # MID-360 은 4라인. feature_extract_enable:false 라
                                         # line 은 실제로 안 쓰이지만 값은 맞춰 둔다.
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     40.0       # MID-360 실사양(40m@10%). 실측 최대 반환도 20m 라
                                       # 100 은 ikd-tree 큐브만 헛되이 키운다.
           
            extrinsic_est_en:  false     # true: enable the online estimation of IMU-LiDAR extrinsic
            # 2026-09-02 바닥 평면 실측 top 장착값에서 유도 (tools/check_frames.py 로 검증)
            extrinsic_T: [ 0.01318, 1.31736, -0.20576 ]
            extrinsic_R: [ -0.99995,  0.     , -0.00987,
                            0.00986,  0.01877, -0.99978,
                            0.00019, -0.99982, -0.01877]

        ref_from_body_xyz: [ 0.01318, 1.31736, -0.20576 ]   # extrinsic_T 와 같아야 한다
        ref_from_body_rpy: [ -1.589566, -0.000185, 3.131728 ]  # top 이 -90도에서 1.08도 더 기움

        publish:
            tf_en: false                 # camera_init->body TF. 정식 트리는 tf_2d 가 내는
                                         # map->odom->base_link 라 끈다. 디버그 시만 true
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: true                 # true: publish Map cloud
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: false      # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
