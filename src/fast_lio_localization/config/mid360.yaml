/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 3
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        # Global localization tuning
        # The indoor LiDAR+map overlap in this project often yields ICP fitness
        # around 0.83, so 0.9 was rejecting otherwise good manual initial poses.
        map_voxel_size: 0.1
        scan_voxel_size: 0.1
        freq_localization: 0.5
        localization_th: 0.80
        continuous_global_localization: false
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        # 3D prior map. navigation/map 에 2D 점유맵과 함께 보관한다.
        # 주의: /map_save 서비스를 부르면 이 경로에 덮어쓴다. 측위 중에는 부르지 말 것.
        map_file_path: "/home/shw/hw/src/navigation/map/test.pcd"

        common:
            lid_topic:  "/livox_merge/merged_pointcloud"   # PointCloud2. 범용 포맷으로 통일
            imu_topic:  "/livox/imu_192_168_1_135"   # 상단(livox_top) MID-360 내장 IMU
            time_sync_en: false        # 라이다와 IMU가 같은 장비(MID-360) 클럭이므로 불필요
                                        # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        preprocess:
            lidar_type: 3                # 3 = ouster 포맷. livox_merge 의 PointOuster 구조체가
                                         # ouster_ros::Point 와 필드/타입/순서까지 동일하다.
                                         # (x y z intensity t reflectivity ring ambient range)
            scan_line:  8                # MID-360 4라인 x 2대. livox_merge 가 ring 오프셋을 주므로 합산값
            blind: 0.5
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  true      # true: enable the online estimation of IMU-LiDAR extrinsic
            # 입력 클라우드는 livox_merge 가 base_footprint 로 보낸 것이고,
            # IMU 는 livox_top 안에 있다. 그래서 이 값은 한 대짜리 MID-360 의
            # 공장 오프셋이 아니라 base_footprint -> IMU 전체 변환이다.
            #   inverse( T(base_footprint<-livox_top) * T(livox_top<-IMU) )
            # 값이 바뀌면 아래 ref_from_body_* 도 같이 바꿔야 한다.
            extrinsic_T: [ 0.0, 0.82321, -0.23088 ]
            extrinsic_R: [ -1., 0., 0.,
                            0., 0., -1.,
                            0., -1., 0.]

        # tf_2d_bridge: body(IMU) 에서 본 차량 정렬 기준점.
        # 위 extrinsic_T/R 와 같은 기하 (base_footprint -> IMU 의 역변환).
        # 한쪽을 바꾸면 반드시 tools/check_frames.py 로 정합을 확인할 것.
        ref_from_body_xyz: [ 0.0, 0.82321, -0.23088 ]
        ref_from_body_rpy: [ -1.5707963267948966, 0.0, -3.141592653589793 ]  # -pi/2 0 -pi

        publish:
            tf_en: false                 # camera_init->body TF. 정식 트리는 tf_2d 가 내는
                                         # map->odom->base_link 라 끈다. 디버그 시만 true
            path_en: true                # true: publish Path
            effect_map_en: false         # true: publish Effects
            map_en: true                 # true: publish Map cloud
            scan_publish_en:  true       # false: close all the point cloud output
            dense_publish_en: false      # false: low down the points number in a global-frame point clouds scan.
            scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: true
            interval: -1                 # how many LiDAR frames saved in each pcd file; 
                                        # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
