bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    # MPPI 권장 구성: model_dt = 1/controller_frequency. Jetson 부하도 고려.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 40.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.60
      yaw_goal_tolerance: 0.90
    # MPPI + Ackermann 모델: 후륜 역조향(조향식) 차량에 맞는 최소회전반경
    # 제약을 지키면서, local costmap 의 동적 장애물을 롤아웃 비용으로 직접
    # 회피한다. RPP 는 경로 추종만 하고 회피는 못 해서 교체했다.
    # cmd_vel(v, w) -> 조향각 변환은 차량 하부 제어기가 담당한다.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 지평선은 최소한 "차체 길이 + 최소회전반경 선회호" 를 담아야 한다.
      # 차체 1.62m, 90도 선회 호 길이 = 1.30 * pi/2 = 2.04m.
      # 130 * 0.1s = 13s -> 0.2m/s 로 2.6m. 회피 기동이 롤아웃 안에 들어온다.
      # (이전 60스텝 = 1.2m 는 차체보다도 짧아서 회피 대신 감속만 나왔다)
      time_steps: 130
      model_dt: 0.1          # = 1/controller_frequency (MPPI 권장)
      batch_size: 600        # batch*steps 를 이전(1200*60=72000)과 비슷한 78000 으로
      iteration_count: 1
      vx_std: 0.08
      vy_std: 0.0
      wz_std: 0.2
      vx_max: 0.20
      vx_min: 0.0            # 전진 전용. 플래너(DUBIN)와 일치
      vy_max: 0.0
      wz_max: 0.30           # motor_node max_angular_speed(0.3) 와 일치. 넘기면 거기서 잘린다
      ax_max: 0.3
      ax_min: -0.3
      ay_max: 0.0
      az_max: 0.5
      motion_model: "Ackermann"
      AckermannConstraints:
        # 플래너 GridBased.minimum_turning_radius 와 반드시 같은 값 유지.
        min_turning_r: 1.30
      prune_distance: 2.0
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: true   # 동적 장애물 환경 권장값. 노이즈 재사용을 막는다
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # 장애물 비용. 직사각형 차체(1.62x0.95)라 원 근사 대신 footprint 검사.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      # SmacHybrid 가 주행 가능한 방향까지 주는 경로라 orientation 사용
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      # controller_frequency(10Hz) 와 맞춘다. 5Hz 면 컨트롤러가 절반은 낡은
      # 코스트맵으로 롤아웃한다. 입력 클라우드는 20Hz 라 여유가 있다.
      update_frequency: 10.0
      publish_frequency: 2.0
      # REP-105: local costmap 은 연속 프레임인 odom 에 둔다. map 에 두면
      # global_localization 의 ICP 보정(map->odom 점프)이 회피 중인 장애물
      # 위치까지 같이 옮겨 버린다. static_layer 는 TF 로 map->odom 을 따라온다.
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      # width/height 는 nav2 에서 int 파라미터다. 12.0 처럼 실수로 쓰면 기동이
      # 깨진다 (예전 "height 타입" 크래시의 원인). 반드시 정수로 적을 것.
      # 기본값 5x5m 는 base_link 중심이라 앞범퍼(0.81) 기준 1.69m 밖에 안 보였다.
      # 사람(1.2m/s)과 마주치면 경고시간이 1.2초라 회피가 성립하지 않는다.
      # 12x12m -> 범퍼 앞 5.2m. obstacle_max_range 6.0 도 이제 거의 살아난다.
      width: 12
      height: 12
      resolution: 0.05
      # Vehicle footprint based on measured size:
      # length 1.62 m, max width 0.952 m, with small safety margin.
      footprint: "[[0.81, 0.48], [0.81, -0.48], [-0.81, -0.48], [-0.81, 0.48]]"
      # obstacle_layer: 동적 장애물. 입력은 livox_merge 의 sliced 클라우드
      # (base_footprint 프레임, z 슬라이스 + 차체 크롭 적용됨). TF 정리 후
      # base_footprint 가 rigid 프레임이 되어 이제 안전하게 넣을 수 있다.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: merged_cloud
        merged_cloud:
          topic: /livox_merge/merged_pointcloud_sliced
          data_type: "PointCloud2"
          marking: True
          clearing: True
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          # 주의: 이 두 값은 costmap 의 global_frame(odom) 기준이고,
          # livox_merge 의 slice_z_min/max 는 base_footprint(지면) 기준이다.
          # odom 의 z=0 은 base_link 라 지면보다 0.5m 위 -> 두 값을 같은 숫자로
          # 맞추면 안 된다. 실제 z 필터는 slice_z 가 담당하고 여기는 여유폭이다.
          # (slice 0.15~2.3 지면기준 == -0.35~1.8 odom기준, 아래 범위 안에 든다)
          min_obstacle_height: -0.5
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 내접반경(0.49)이 아니라 외접반경(0.94) 이상으로 잡아야 한다.
        # nav2_mppi_controller/src/critics/cost_critic.cpp 의 inCollision 은
        #   cost >= possibly_inscribed_cost_ 일 때만 실제 footprint 검사를 한다.
        # possibly_inscribed_cost_ 는 외접반경에서의 인플레이션 비용(여기선 약 65)
        # 인데, inflation_radius 가 0.55 면 장애물에서 0.55~0.94m 떨어진 셀은
        # 비용이 0 이라 이 검사를 건너뛴다. 그런데 차체 대각 반경은 0.94m 라
        # 그 구간에서 차체 모서리가 실제로 벽에 박혀도 충돌로 안 잡혔다.
        # -> 0.95 로 올려서 검사 구간을 차체 외접원 전체로 덮는다.
        # (253 은 CostCritic 이 충돌로 보지 않으므로 회피 여유만 늘어난다)
        cost_scaling_factor: 3.0
        inflation_radius: 0.95
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      # local costmap 과 반드시 같은 실측 footprint 를 쓴다. 전역이 더 작으면
      # 플래너가 "지나갈 수 있다" 고 판단한 틈을 MPPI(CostCritic,
      # consider_footprint=true)가 거부하면서 그 자리에 멈춘다.
      # 벽에 붙여 주차했을 때의 "Starting point in lethal space" 는 footprint 를
      # 줄여서가 아니라 출발 위치를 벽에서 20~30cm 띄워 푼다.
      footprint: "[[0.81, 0.48], [0.81, -0.48], [-0.81, -0.48], [-0.81, 0.48]]"
      resolution: 0.05
      track_unknown_space: true
      # obstacle_layer 를 글로벌에도 넣어, 지도에 없는 장애물이 오래 머물면
      # 주기 재계획(BT 0.2Hz)이 아예 돌아가는 경로를 뽑도록 한다.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: merged_cloud
        merged_cloud:
          topic: /livox_merge/merged_pointcloud_sliced
          data_type: "PointCloud2"
          marking: True
          clearing: True
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          min_obstacle_height: -0.5
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 값 근거 (nav2_smac_planner/src/collision_checker.cpp):
        #  - footprint 외곽 판정 임계는 OCCUPIED(254) 다. 253(INSCRIBED)은
        #    외곽에 닿아도 충돌이 아니다.
        #  - 중심 셀만 253/254 면 즉시 충돌. 253 띠 폭은 inflation_radius 와
        #    무관하게 항상 min(inflation_radius, 내접반경 0.49) 로 잘린다.
        #    -> 0.49 이상으로 키워도 진입금지 영역이 넓어지지 않는다.
        #  - inflation_radius 가 외접반경(sqrt(0.81^2+0.48^2)=0.94) 보다 작으면
        #    possible_inscribed_cost_ = 0 이 되어 Smac 이 매 노드마다 전체
        #    footprint 검사를 도는 느린 경로로 떨어진다.
        # 그래서 외접반경 이상인 0.95 로 둔다. 이때 비로소 0.49~0.95 구간에
        # 감쇠 기울기가 생겨 Smac 의 cost_penalty 도 실제로 동작한다.
        # (이전 0.08 은 nav2 자신이 "inscribed 0.490 보다 작다" 고 ERROR 를
        #  찍던 값이다. 기울기가 없어 cost_penalty 가 무효였다.)
        cost_scaling_factor: 3.0
        inflation_radius: 0.95
      always_send_full_costmap: True

# map_server 블록은 두지 않는다. navigation_launch.py 의 lifecycle_nodes 에
# map_server 가 없어서 Nav2 는 자체 map_server 를 띄우지 않는다. 2D 점유맵은
# localization.launch.py 가 띄운 map_server 가 /map 으로 발행하고 costmap 의
# static_layer 가 그걸 구독한다. 맵 교체는 launch 의 map 인자 하나로 한다.

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 3.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 1.00
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 4.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # 반드시 MPPI 의 AckermannConstraints.min_turning_r 과 같은 값이어야 한다.
      # 다르면 플래너가 컨트롤러가 못 따라가는 경로를 내고 코너에서 컷이 난다.
      # (실측 (1.29/2)/tan55 = 0.45m 라 1.30 은 보수값)
      minimum_turning_radius: 1.30
      reverse_penalty: 100.0
      change_penalty: 0.0
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # BT 는 wait 만 쓴다. backup / drive_on_heading 은 rbio 앱이 도킹 접근·후퇴에
    # 액션 클라이언트로 직접 호출한다 (/backup, /drive_on_heading). 회전형 spin 은
    # 조향식 차량에서 불가능하므로 넣지 않는다.
    behavior_plugins: ["wait", "backup", "drive_on_heading"]
    wait:
      plugin: "nav2_behaviors/Wait"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.30
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
