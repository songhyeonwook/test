controller_server:
  ros__parameters:
    use_sim_time: False
    # MPPI 권장 구성: model_dt = 1/controller_frequency. Jetson 부하도 고려.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 40.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.60
      yaw_goal_tolerance: 0.90
    # MPPI + Ackermann 모델: 후륜 역조향(조향식) 차량에 맞는 최소회전반경
    # 제약을 지키면서, local costmap 의 동적 장애물을 롤아웃 비용으로 직접
    # 회피한다. RPP 는 경로 추종만 하고 회피는 못 해서 교체했다.
    # cmd_vel(v, w) -> 조향각 변환은 차량 하부 제어기가 담당한다.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # 지평선은 최소한 "차체 길이 + 최소회전반경 선회호" 를 담아야 한다.
      # 차체 1.62m, 90도 선회 호 길이 = 1.30 * pi/2 = 2.04m.
      # 130 * 0.1s = 13s -> 0.2m/s 로 2.6m. 회피 기동이 롤아웃 안에 들어온다.
      # (이전 60스텝 = 1.2m 는 차체보다도 짧아서 회피 대신 감속만 나왔다)
      time_steps: 130
      model_dt: 0.1          # = 1/controller_frequency (MPPI 권장)
      batch_size: 600        # batch*steps 를 이전(1200*60=72000)과 비슷한 78000 으로
      iteration_count: 1
      vx_std: 0.08
      vy_std: 0.0
      wz_std: 0.2
      vx_max: 0.20
      vx_min: 0.0            # 전진 전용. 플래너(DUBIN)와 일치
      vy_max: 0.0
      wz_max: 0.30           # motor_node max_angular_speed(0.3) 와 일치. 넘기면 거기서 잘린다
      ax_max: 0.3
      ax_min: -0.3
      ay_max: 0.0
      az_max: 0.5
      motion_model: "Ackermann"
      AckermannConstraints:
        min_turning_r: 1.30
      prune_distance: 2.0
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: true   # 동적 장애물 환경 권장값. 노이즈 재사용을 막는다
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic",
                "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
                "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      # 장애물 비용. 직사각형 차체(1.62x0.95)라 원 근사 대신 footprint 검사.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      # SmacHybrid 가 주행 가능한 방향까지 주는 경로라 orientation 사용
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      # controller_frequency(10Hz) 와 맞춘다. 5Hz 면 컨트롤러가 절반은 낡은
      # 코스트맵으로 롤아웃한다. 입력 클라우드는 20Hz 라 여유가 있다.
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: False
      rolling_window: true
      # width/height 는 nav2 에서 int 파라미터다. 12.0 처럼 실수로 쓰면 기동이
      # 깨진다 (예전 "height 타입" 크래시의 원인). 반드시 정수로 적을 것.
      # 기본값 5x5m 는 base_link 중심이라 앞범퍼(0.81) 기준 1.69m 밖에 안 보였다.
      # 사람(1.2m/s)과 마주치면 경고시간이 1.2초라 회피가 성립하지 않는다.
      # 12x12m -> 범퍼 앞 5.2m. obstacle_max_range 6.0 도 이제 거의 살아난다.
      width: 12
      height: 12
      resolution: 0.05
      # Vehicle footprint based on measured size:
      # length 1.62 m, max width 0.952 m, with small safety margin.
      footprint: "[[0.81, 0.48], [0.81, -0.48], [-0.81, -0.48], [-0.81, 0.48]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: merged_cloud
        merged_cloud:
          topic: /livox_merge/merged_pointcloud_sliced
          data_type: "PointCloud2"
          marking: True
          clearing: True
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          min_obstacle_height: -0.5
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.95
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.81, 0.48], [0.81, -0.48], [-0.81, -0.48], [-0.81, 0.48]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: merged_cloud
        merged_cloud:
          topic: /livox_merge/merged_pointcloud_sliced
          data_type: "PointCloud2"
          marking: True
          clearing: True
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          min_obstacle_height: -0.5
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.95
      always_send_full_costmap: True

map_server:
  ros__parameters:
    use_sim_time: False
    # launch 의 map 인자로 덮어쓸 수 있다. 여기 값은 nav2 가 자체 map_server 를
    # 띄울 때만 쓰인다(측위는 localization.launch.py 가 따로 띄운다).
    yaml_filename: "/home/shw/hw/src/navigation/map/test.yaml"

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 3.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 1.00
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 4.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # 반드시 MPPI 의 AckermannConstraints.min_turning_r 과 같은 값이어야 한다.
      # 다르면 플래너가 컨트롤러가 못 따라가는 경로를 내고 코너에서 컷이 난다.
      # (실측 (1.29/2)/tan55 = 0.45m 라 1.30 은 보수값)
      minimum_turning_radius: 1.30
      reverse_penalty: 100.0
      change_penalty: 0.0
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: False
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.30
    min_rotational_vel: 0.0
    rotational_acc_lim: 0.5

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # motor_node 한계(max_linear 0.2, max_angular 0.3)와 동일하게 둔다
    max_velocity: [0.20, 0.0, 0.30]
    min_velocity: [0.0, 0.0, -0.30]
    max_accel: [0.3, 0.0, 0.5]
    max_decel: [-0.3, 0.0, -0.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
