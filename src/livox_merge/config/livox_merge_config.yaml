merge_lidar_node:
  ros__parameters:
    sync_frequency: 20.0
    # sliced 출력 = nav2 costmap 의 장애물 입력 (base_link 기준 z 대역).
    # base_link 가 지면에 있으므로 이 z 는 그대로 "지면 위 높이"다.
    # z_min 0.15 = 지면 위 15cm. 더 낮추면 바닥 반사가 장애물로 찍힌다.
    slice_z_min: 0.15
    slice_z_max: 2.3
    # 차체 셀프 반사 크롭 (footprint 0.81x0.48 + 여유)
    slice_crop_half_x: 0.90
    slice_crop_half_y: 0.55

    lidars.topics:
      - "/livox/lidar_192_168_2_102"   # lidar_0 = livox_front
      - "/livox/lidar_192_168_3_144"   # lidar_1 = livox_rear
      # livox_top(192.168.1.135)은 병합 안함.

    lidars.extrinsics.lidar_0:   # base_link(지면) <- livox_front
      - 0.000000
      - -1.000000
      - 0.000000
      - 0.697000        # ---
      - 1.000000
      - 0.000000
      - 0.000000
      - 0.350000        # ---
      - 0.000000
      - 0.000000
      - 1.000000
      - 0.320000        # ---
      - 0.000000
      - 0.000000
      - 0.000000
      - 1.000000


    lidars.extrinsics.lidar_1:   # base_link(지면) <- livox_rear
      - 0.000000
      - 1.000000
      - 0.000000
      - -0.600000        # ---
      - -1.000000
      - 0.000000
      - 0.000000
      - -0.340000        # ---
      - 0.000000
      - 0.000000
      - 1.000000
      - 0.320000        # ---
      - 0.000000
      - 0.000000
      - 0.000000
      - 1.000000


    output.pointcloud2: "/livox_merge/merged_pointcloud"
    output.livox_custom: "/livox_merge/merged_livox"
    output.pointcloud2_sliced: "/livox_merge/merged_pointcloud_sliced"
    output.frame_id: "base_link"   # 위 extrinsic 이 실제로 보내는 프레임(지면 기준)
