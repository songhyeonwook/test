# 상단 라이다(livox_top, 192.168.1.135) 를 PointCloud2 로 내보내는 설정.
#
# 드라이버는 CustomMsg 로만 내고(xfer_format=1, front/rear 병합이 그걸 쓴다),
# top 은 병합에 안 들어가서 그동안 아무도 안 봤다. merge_lidar_node 를 라이다
# 1대짜리로 하나 더 띄워서 형식만 바꿔 낸다 - 병합 경로는 건드리지 않는다.
#
# extrinsic 은 단위행렬이고 frame_id 는 livox_top 이다. 즉 센서 원점 그대로 내고,
# 차체 기준 위치는 URDF 의 livox_top TF 가 잡는다(RViz 에서 바로 맞게 보인다).
livox_top_node:
  ros__parameters:
    input_type: "custom"
    sync_frequency: 20.0   # 폴링 주기. 실제 출력은 드라이버 발행률(10Hz)을 따른다

    lidars.topics:
      - "/livox/lidar_192_168_1_135"   # lidar_0 = livox_top

    lidars.extrinsics.lidar_0:   # livox_top <- livox_top (단위행렬)
      - 1.000000
      - 0.000000
      - 0.000000
      - 0.000000        # ---
      - 0.000000
      - 1.000000
      - 0.000000
      - 0.000000        # ---
      - 0.000000
      - 0.000000
      - 1.000000
      - 0.000000        # ---
      - 0.000000
      - 0.000000
      - 0.000000
      - 1.000000

    output.pointcloud2: "/livox_top/pointcloud"
    output.livox_custom: "/livox_top/livox"
    output.pointcloud2_sliced: "/livox_top/pointcloud_sliced"   # 쓰는 데 없음
    output.frame_id: "livox_top"
