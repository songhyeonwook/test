# bag 재생용 병합 설정.
#
# 실장비(livox_merge.yaml)와 값이 같고 clouds 만 다르다. 예전에는 bag 이
# PointCloud2, 실장비가 CustomMsg 라 input_type 이 갈렸는데, 지금은 실장비도
# xfer_format=0 (PointCloud2)로 내므로 형식 차이는 없다.
#
# clouds: 2  -> cloud_in1(front) + cloud_in2(rear). 기존 bag 이 이 두 개만
#               녹화돼 있어서 기본값이다. top 까지 들어 있는 bag 이면
#               bag_localization.launch.py 를 clouds:=3 으로 띄우면 된다
#               (sync_all 때문에 없는 입력을 3 으로 잡으면 발행이 멈춘다).
#
# use_sim_time 은 launch 가 붙인다.
/**:
  ros__parameters:
    target_frame: "base_link"
    clouds: 2
    hz: 50.0
    sync_all: true
    stamp_from_input: true

    slice_enable: true
    slice_z_min: 0.15
    slice_z_max: 2.3
    crop_half_x: 0.90
    crop_half_y: 0.55
